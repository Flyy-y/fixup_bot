# Dev-only compose file for local testing.
# Reads the Discord token from a local .env file (which is git-ignored).
services:
  fixupx-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: fixupx-bot:dev
    restart: unless-stopped
    env_file:
      - .env
    # Drop all Linux capabilities and disallow privilege escalation.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
